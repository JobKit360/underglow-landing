<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview: Host or client?</title>
<link rel="stylesheet" href="/preview/preview.css">
</head>
<body>
<div class="wrap">
  <p class="banner">Static prototype, buttons do nothing. <a href="/preview/">Back to previews</a></p>
  <div class="top"><img src="/preview/logo.svg" alt=""><h1>Host or client?</h1></div>
  <div class="cards">
    <section class="card glass"><h2>Host</h2><p class="sub">Runs UnderGlow and Claude on this PC.</p><button class="btn primary" type="button">Host</button></section>
    <section class="card glass"><h2>Client</h2><p class="sub">Connects to your host PC.</p>
      <div class="field">Host<span>192.168.1.20:7810</span></div>
      <div class="field">Code from the host<span>XXXX-XXXX</span></div>
      <button class="btn primary" type="button">Connect</button></section>
  </div>
</div>
</body>
