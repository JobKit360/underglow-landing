<style>
:root{
  --bg:#02060b;--panel:rgba(5,16,26,.74);--panel2:rgba(8,24,38,.85);
  --cyan:#5ad8ff;--cyan2:#bdefff;--dim:#6f93a8;--faint:#3d5a6c;--text:#d6eef9;
  --line:rgba(90,216,255,.16);--line2:rgba(90,216,255,.32);
  --ok:#5cf2b0;--amber:#ffb648;--red:#ff5a5a;
  --head:'Rajdhani',sans-serif;--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;color:var(--text);font:15.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 700px at 30% 40%,rgba(30,110,150,.16),transparent 70%),
    radial-gradient(1200px 800px at 80% 120%,rgba(10,60,90,.25),transparent 70%),
    linear-gradient(rgba(90,216,255,.035) 1px,transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg,rgba(90,216,255,.035) 1px,transparent 1px) 0 0/44px 44px,
    var(--bg)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));z-index:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
textarea,input{font:inherit;color:inherit;background:none;border:0;outline:none}
::selection{background:rgba(90,216,255,.3)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}

/* HUD panel: hairline border + bright corner brackets in --c */
.hud{position:relative;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);--c:var(--cyan)}
.hud::before{content:"";position:absolute;inset:-1px;pointer-events:none;background-repeat:no-repeat;
  background-image:linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c));
  background-size:14px 1.5px,1.5px 14px,14px 1.5px,1.5px 14px,14px 1.5px,1.5px 14px,14px 1.5px,1.5px 14px;
  background-position:top left,top left,top right,top right,bottom left,bottom left,bottom right,bottom right}
.label{font:600 11px var(--head);letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes bl{50%{opacity:0}}

/* ---------- header + tabs ---------- */
header{position:relative;z-index:2;display:flex;align-items:center;gap:22px;padding:12px 20px 0;padding-top:calc(12px + env(safe-area-inset-top))}
.mark{font:700 18px var(--head);letter-spacing:.42em;color:var(--cyan2);flex:none}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
nav::-webkit-scrollbar{display:none}
nav button{padding:6px 12px 7px;font:600 12.5px var(--head);letter-spacing:.24em;text-transform:uppercase;color:var(--dim);white-space:nowrap;border-bottom:1.5px solid transparent}
nav button:hover{color:var(--cyan2)}
nav button.on{color:var(--cyan2);border-color:var(--cyan)}
nav button sup{font:500 10px var(--mono);letter-spacing:0;color:var(--cyan);margin-left:4px}
.right{margin-left:auto;display:flex;align-items:center;gap:18px;flex:none}
.clock{font:500 13px var(--mono);color:var(--dim);letter-spacing:.08em}
.clock b{color:var(--cyan2);font-weight:500}
.online{display:flex;align-items:center;gap:7px;font:500 11px var(--mono);letter-spacing:.12em;color:var(--dim)}
.sq{width:6px;height:6px;background:var(--red)}
.online.on .sq{background:var(--ok);box-shadow:0 0 8px var(--ok)}

.screens{position:relative;z-index:1;flex:1;min-height:0;display:flex;--chatw:480px}
/* app shell: [page pane | splitter | chat pane]. The chat is mounted once; every page lays out against the page pane, never the window. */
.pagepane{position:relative;flex:1 1 0;min-width:0;min-height:0;container-type:inline-size;container-name:page}
.split{flex:none;position:relative;width:14px;cursor:col-resize;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;outline:none}
/* chat is a persistent right column on every tab; screens get only the remaining width */
.screen{position:absolute;inset:0;display:none;padding:16px 20px 20px}
.screen.on,.screen.leave{display:flex}.screen.on{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}

/* ---------- JARVIS (main) ---------- */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;gap:4px}
.status{font:600 14px var(--head);letter-spacing:.36em;color:var(--cyan2);text-transform:uppercase}
.readout{font:500 11px var(--mono);color:var(--faint);letter-spacing:.1em}


.convo{position:relative;flex:none;width:var(--chatw);display:flex;flex-direction:column;min-height:0}
.chat{flex:1;overflow-y:auto;padding:18px 18px 10px;display:flex;flex-direction:column;gap:14px}
.chat:empty::before{content:"At your service, sir. Type a command.";margin:auto;max-width:260px;text-align:center;color:var(--faint);font-size:14px}
.msg{max-width:94%}
.msg .who{font:500 10.5px var(--mono);letter-spacing:.14em;color:var(--faint);margin-bottom:3px}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}
.msg.j{align-self:flex-start;padding-left:12px;border-left:2px solid var(--cyan)}
.msg.j .body{color:#dff5ff}.msg.j .who{color:var(--cyan)}
.msg.me{align-self:flex-start;text-align:left;padding:6px 12px;border-left:2px solid rgba(214,238,249,.35);background:rgba(214,238,249,.05)}
.msg.me .body{color:#b9cdd8}
.msg.live .body::after{content:"▌";color:var(--cyan);animation:bl 1s steps(1) infinite}
.note{align-self:center;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:center}
.note.err{color:var(--red)}
code{font:.88em var(--mono);color:var(--cyan2);background:rgba(90,216,255,.08);padding:0 4px}
pre{font:12.5px/1.45 var(--mono);background:rgba(0,0,0,.35);border:1px solid var(--line);padding:8px 10px;overflow:auto;white-space:pre;text-align:left}

.compose{position:relative;display:flex;align-items:flex-end;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.input{flex:1;display:flex;align-items:flex-end;border-bottom:1px solid var(--line2);transition:border-color .2s}
.input:focus-within{border-color:var(--line2)}
.input textarea{flex:1;resize:none;min-height:42px;padding:10px 2px;font-size:15.5px;overflow-y:hidden}
@media (prefers-reduced-motion:no-preference){#jIn{transition:height .12s ease-out}}
.input textarea::placeholder{color:var(--faint)}
.icon{width:42px;height:42px;display:grid;place-items:center;color:var(--dim);flex:none}
.icon:hover{color:var(--cyan2)}
.icon svg{width:20px;height:20px}
.icon[hidden]{display:none}
/* Stop uses the same .icon box as Send; no own sizing rules */
.hints{position:absolute;left:14px;right:14px;bottom:100%;background:var(--panel2);border:1px solid var(--line2);display:none;flex-direction:column;padding:4px 0;z-index:5}
.hints.on{display:flex}
.hints button{display:flex;gap:12px;padding:6px 12px;text-align:left;font:13px var(--mono);color:var(--cyan2)}
.hints button span{color:var(--faint)}
.hints button:hover,.hints button.sel{background:rgba(90,216,255,.1)}

/* ---------- AGENTS (secondary) ---------- */
#s-agents{flex-direction:column;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;align-content:start}
/* outline = state */
.tag{margin-left:auto;display:flex;align-items:center;gap:6px;font:600 11px var(--head);letter-spacing:.2em;text-transform:uppercase;color:var(--c);white-space:nowrap}
.tag i{width:6px;height:6px;background:var(--c)}
.working .tag i{animation:bl 1s steps(1) infinite}

.x{width:34px;height:34px;border:1px solid var(--line2);color:var(--dim);font-size:15px;flex:none}
.x:hover{color:var(--cyan2);border-color:var(--cyan)}
.send{width:44px;height:44px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--cyan);flex:none}
.send:hover{background:var(--cyan);color:#02131d}
.send svg{width:19px;height:19px}

/* ---------- custom screens ---------- */
#s-custom{flex-direction:column;gap:10px}
.sbar{display:flex;align-items:center;gap:14px}
.sbar h2{margin:0;font:700 16px var(--head);letter-spacing:.3em;text-transform:uppercase;color:var(--cyan2)}
.sbar .label{margin-left:auto}
.btn{font:600 11px var(--head);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line2);padding:5px 11px}
.btn:hover{color:var(--cyan2);border-color:var(--cyan)}
.sbody iframe{flex:1;width:100%;border:1px solid var(--line);background:var(--bg)}
.sbody iframe.next{position:absolute;inset:0;visibility:hidden} /* next live-build version, loading off-screen */
.sbody{flex:1;position:relative;display:flex;min-height:0}

/* ---------- top-bar widgets (data/topbar/*.json, live) ---------- */
.widgets{display:flex;gap:10px;align-items:center}
.wdg{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 9px;--c:var(--line2)}
.wdg .wt{font:600 10px var(--head);letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.wdg .rows{display:flex;flex-direction:column;gap:2px}
.wm{display:grid;grid-template-columns:18px 56px 30px 40px;align-items:center;gap:6px;font:500 10px/1.3 var(--mono);color:var(--dim);white-space:nowrap}
.wm .bar{height:4px;background:rgba(90,216,255,.12);position:relative;overflow:hidden}
.wm .bar i{position:absolute;inset:0 auto 0 0;background:var(--cyan);box-shadow:0 0 6px var(--cyan);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.wm.hot .bar i{background:var(--amber);box-shadow:0 0 6px var(--amber)}.wm.crit .bar i{background:var(--red);box-shadow:0 0 6px var(--red)}
.wm b{color:var(--cyan2);font-weight:500;text-align:right}.wm.hot b{color:var(--amber)}.wm.crit b{color:var(--red)}
.wm .cd{color:var(--faint)}
.wdg[hidden]{display:none}
.wdg[data-tone=bad] .wm .bar i{background:var(--red);box-shadow:0 0 6px var(--red)}.wdg[data-tone=bad] .wm b{color:var(--red)}
.wdg[data-tone=ok] .wm b{color:var(--ok)}
.wv{font:500 10px/1.3 var(--mono);color:var(--dim);white-space:nowrap}.wv b{color:var(--cyan2);font-weight:500;margin-left:6px}

/* ---------- Jarvis building things ---------- */
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes tabin{0%{opacity:0;transform:translate(26px,-16px) scale(.6);filter:blur(5px)}65%{opacity:1;transform:translate(0,2px) scale(1.06);filter:none}100%{transform:none}}
@keyframes glow{0%,100%{text-shadow:none;box-shadow:none}30%{text-shadow:0 0 10px var(--cyan),0 0 22px var(--cyan);box-shadow:0 6px 18px -8px var(--cyan)}}
@keyframes wdgin{0%{opacity:0;transform:translateY(-22px) scale(.7);filter:blur(5px)}65%{opacity:1;transform:translateY(2px) scale(1.04);filter:none}100%{transform:none}}
@keyframes wglow{0%,100%{box-shadow:none}30%{box-shadow:0 0 22px rgba(90,216,255,.55),inset 0 0 12px rgba(90,216,255,.25)}}
nav button.arrive{animation:tabin .7s cubic-bezier(.2,.8,.2,1) both,glow 1.8s .45s ease-out}
nav button.landed{animation:glow 1.8s ease-out}
.wdg.arrive{animation:wdgin .7s cubic-bezier(.2,.8,.2,1) both,wglow 1.8s .45s ease-out}
nav button.building{color:transparent;border-bottom:1.5px dashed var(--line2);-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(90deg,var(--faint) 35%,var(--cyan2) 50%,var(--faint) 65%);background-size:200% 100%;animation:shimmer 1.6s linear infinite}
nav button.building.arrive{animation:tabin .7s cubic-bezier(.2,.8,.2,1) both,shimmer 1.6s linear infinite}
nav button.leave{pointer-events:none}
#frame.assemble{animation:reveal .9s cubic-bezier(.2,.8,.2,1)}
@keyframes reveal{0%{clip-path:inset(0 0 100% 0);opacity:.2;filter:blur(6px) brightness(1.7)}60%{filter:blur(1px) brightness(1.2)}100%{clip-path:inset(0);opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){
  nav button.arrive,nav button.landed,.wdg.arrive,#frame.assemble{animation:none}
  nav button.building{animation:none;color:var(--dim);background:none}
  .wm .bar i{transition:none}
}

/* ---------- alerts ---------- */
#toasts{position:fixed;top:calc(60px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 24px))}
.toast{padding:10px 14px;cursor:pointer;animation:drop .25s;--c:var(--amber);background:rgba(20,14,4,.94);border-color:rgba(255,182,72,.3)}
.toast.info{--c:var(--cyan);background:rgba(4,14,22,.94);border-color:var(--line2)}
.toast.urgent,.toast.high{--c:var(--red);background:rgba(24,6,6,.94);border-color:rgba(255,90,90,.35)}
.toast b{display:block;font:700 13px var(--head);letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
/* installed copy: "Update ready" stays until Restart (desktop/install.mjs release / rollback) */
.toast.upd{cursor:default}.toast.upd ul{margin:6px 0 0;padding-left:16px;font-size:12px;opacity:.8}.toast.upd .updrow{display:flex;gap:8px;margin-top:8px}
.toast.upd button{font:600 12px var(--head);padding:5px 12px;border-radius:8px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:inherit;cursor:pointer}
.toast.upd button.go{border-color:var(--c);color:var(--c)}.toast.upd button:disabled{opacity:.6;cursor:default}
@keyframes drop{from{transform:translateY(-8px);opacity:0}}

@media (max-width:900px){
  header{padding:10px 12px 0;padding-top:calc(10px + env(safe-area-inset-top));padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right));gap:12px}
  .mark{font-size:15px;letter-spacing:.3em}
  .clock{display:none}
  .wdg .wt,.wm .cd{display:none}
  .wdg{padding:3px 6px}
  .wm{grid-template-columns:16px 34px 26px;gap:4px}
  .screen{padding:10px;padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right));padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  /* phone: text chat lives behind the Chat button */
  .stage{flex:1}
  .convo,.readout{display:none}
  .chatbtn{display:block}
  .grid{grid-template-columns:1fr}
}
.chatbtn{display:none}
/* ---------- mobile: other screens live behind the nav button ---------- */
.navbtn{display:grid;place-items:center;width:32px;height:32px;position:relative;flex:none}
body:not(.mobile) .navbtn{order:1}
body:not(.mobile) header .right{order:2}
body.mobile #tabs{display:none}
body.mobile .navbtn{display:grid;place-items:center;position:absolute;z-index:3;top:10px;left:calc(10px + env(safe-area-inset-left));width:42px;height:42px;color:var(--cyan);border:1px solid var(--line2);background:var(--panel)}
.navbtn[hidden]{display:none!important}
.navbtn svg{width:18px;height:18px}
.fagcnt{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;flex:none;border:1px solid var(--line2);color:var(--dim);font:600 12px var(--mono);order:1}
.fagcnt i{width:7px;height:7px;border-radius:50%;background:var(--dim);opacity:.5}
.fagcnt.live{color:var(--accent,var(--cyan));border-color:var(--accent,var(--cyan))}
.fagcnt.live i{background:var(--accent,var(--cyan));opacity:1}
.fagcnt.on{background:rgba(90,216,255,.18);color:var(--cyan);border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
body.mobile .fagcnt{position:absolute;z-index:3;top:10px;left:calc(60px + env(safe-area-inset-left));height:42px;background:var(--panel)}
.navbtn.dot::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
body.mobile .screen:not(#s-jarvis){padding-top:62px}
#navMenu{position:fixed;inset:0;z-index:12;display:flex;align-items:flex-start;justify-content:center;padding:calc(56px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 12px calc(12px + env(safe-area-inset-left))}
#navMenu[hidden]{display:none}
#pgMenu{position:fixed;inset:0;z-index:12;display:flex;align-items:flex-start;justify-content:center;padding:calc(56px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 12px calc(12px + env(safe-area-inset-left))}

.pgbody{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px}

.pgin{height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--border-default,var(--line2));background:transparent;color:var(--text-primary,inherit);font:13px var(--font-sans,inherit);min-width:0}
.pgbody label[hidden]{display:none}
.pgpick{display:flex;gap:8px;align-items:center}.pgpick .pgin{flex:1}.pgpick .pgbrowse{height:36px;flex:none;padding:0 14px}.pgpick .pgbrowse[hidden]{display:none}
.presumed{font-size:11px;color:var(--muted,#8a8f98);margin-right:8px;white-space:nowrap;animation:presumedPulse 1.6s ease-in-out infinite}
@keyframes presumedPulse{0%,100%{opacity:.45}50%{opacity:1}}
.pgerr{font-size:12px;color:var(--status-error,#d9534f)}
.pgadd{align-self:flex-end}
.tabcard{position:fixed;z-index:5000;display:flex;flex-direction:column;width:300px;padding:6px;border-radius:12px;background:var(--surface-2,var(--panel2));-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 0 0 1px var(--panel-stroke,var(--line2)),var(--shadow-float,0 12px 32px rgba(0,0,0,.5));font:13px var(--font-sans,inherit);color:var(--text-primary,inherit);animation:one-pop .14s var(--ease-out,ease-out) both} /* right-click a page tab: same surface + item rows as the pane menu (.pmenu) */
.tchead{display:flex;gap:12px;align-items:center;padding:6px 6px 8px}
.tclogo{flex:none;width:64px;height:64px;display:grid;place-items:center;padding:8px;border-radius:10px;border:1px solid var(--line2);background:var(--block,rgba(255,255,255,.04));color:inherit;cursor:pointer;transition:border-color .15s,background-color .15s}
.tclogo img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.tclogo.empty{border-style:dashed;color:var(--text-muted,var(--dim));font-size:24px;font-weight:300}
.tclogo:hover,.tclogo.over{border-color:var(--accent,#4A8FE8);background:var(--accent-subtle,rgba(74,143,232,.12))}

.tcname{height:32px;padding:0 10px;border-radius:8px;border:0;background:var(--g-ctl,rgba(255,255,255,.07));box-shadow:var(--g-ctl-ring,inset 0 0 0 1px rgba(255,255,255,.1));color:var(--text-primary,inherit);font:500 13px var(--font-sans,inherit);outline:0;min-width:0;transition:box-shadow .15s}

<script>
const $ = s => document.querySelector(s);
const agents = new Map(), live = {};
// Blank edition (desktop app, server started with FOREMAN_BLANK=1; the server sets window.FOREMAN_BLANK): no Jarvis page,
// lands on Home, logo placeholders. Off = the user's live Foreman, unchanged.
const BLANK = !!window.FOREMAN_BLANK;
const homeTab = () => BLANK ? 'home' : 'fagents'; // landing tab when the asked-for one is gone
let ws, screens = [], tab = homeTab(), firstScreens = true, animIn = false;
const builds = new Map(); // slug -> {slug, title, agent} while a build_screen agent works
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
// Device role, fixed per tab: phones never auto-switch views, desktops are the viewer.
const MOBILE = matchMedia('(max-width: 900px), (pointer: coarse) and (max-height: 500px)').matches;
document.body.classList.toggle('mobile', MOBILE);
const CID = Math.random().toString(36).slice(2, 10); // per-tab client id
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/```\w*\n?([\s\S]*?)```/g, '<pre>$1</pre>').replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const pct = a => { const p = (a.ctxTokens || 0) / (a.lastRun?.win || 1000000) * 100; return (p < 10 ? p.toFixed(1) : Math.round(p)) + "%"; };
const hhmm = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// ONE agent status for every surface: open pane tag/dot/ring, folded card word + bottom label, phone tiles, the Foreman card, settings-panel counts,
// the deck's auto-open (deckKind) and the Waiting test count. Key = the CSS class (shared colours in foreman.css), value = the word shown.
// Same set on every page; only pages WITH the test gate (added pages) also have Waiting test (finished = test there, Complete elsewhere).
//   working/stalled = a run is going (stalled = no SDK events for a while) · fault = error · attn = a question (also on a finished report: needs_you / closing ask) / blocked / went idle unfinished / answered the user directly (reply waiting; not after a sign-off like "done")
//   complete/test = finished (incl. Look at it hand-offs) · idle = everything else (fresh spawns, stopped by the user, nothing needed)
const AST = { idle: 'Idle', working: 'Working', stalled: 'Stalled', attn: 'Needs attention', complete: 'Complete', test: 'Waiting test', fault: 'Fault' };
const secWait = a => !!a.secrets?.length && a.status !== 'working'; // waiting on a secure entry (secret.js): Needs attention, shown as its own red status
const agStatus = a => a.status === 'working' ? (a.stalled ? 'stalled' : 'working') : a.status === 'error' ? 'fault'
  : secWait(a) || a.asking || a.blocked || a.stuck || a.replied ? 'attn' : a.status === 'ready' ? (noTest(groupOf(a)) ? 'complete' : 'test') : 'idle'; // a finished report that still asks the user something = Needs attention
const statusWord = a => secWait(a) ? 'Secure entry' : AST[agStatus(a)];
const statusCls = a => { const k = agStatus(a); return k === 'stalled' ? 'working stalled' : k + (secWait(a) ? ' secure' : ''); }; // stalled keeps 'working' (spinner, Stop button)

const clockTick = () => { const d = new Date(), c = $('#clock'), t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }), dt = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }); // time only; the date on hover
  if (c.textContent !== t) c.textContent = t; if (c.title !== dt) c.title = dt; };
clockTick(); setInterval(clockTick, 1000);
// TEMPORARY (2026-11-14, instead of the app's Ctrl+1 / Ctrl+2): Prod | Dev switch next to the clock. Same computer, the other server's port:
// local 7790 ↔ 7800, Tailscale 8443 ↔ 8444. The view is saved first (typed text, tab, scroll) like an update reload. Hidden on any other port.
(() => {
  const ENV = { 7790: ['prod', 7800], 7800: ['dev', 7790], 8443: ['prod', 8444], 8444: ['dev', 8443] }, p = +location.port, e = ENV[p], sw = $('#envSw');
  document.documentElement.classList.toggle('env-dev', e?.[0] === 'dev'); // amber frame round the whole HUD on dev (foreman.css html.env-dev)
  if (!e || !sw) return;
  sw.hidden = false;
  // Seamless switch (2026-11-15): check the other server answers first (no landing on an error page); fade out here and in there
  // (foreman.css env-out / env-in). Each side reopens where you left IT (2026-11-16: dev -> prod landed on Home, because dev is
  // the blank edition with other page ids and fell back to Home, which was then carried back): the view is no longer carried, each side
  // keeps its own in localStorage (hudLeft, saved on pagehide). The hash only marks a switch: an empty view (fields/scroll/win, no tab)
  // so an older side that still reads a carried view keeps its own tab too.
  let going = false;
  const go = async () => {
    if (going) return; going = true;
    const u = new URL(location.href); u.port = String(e[1]); u.pathname = '/'; u.search = ''; u.hash = '';
    const name = e[0] === 'dev' ? 'Prod' : 'Dev';
    sw.classList.add('busy');
    const up = await fetch(u.origin + '/healthz', { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(2500) }).then(() => true, () => false);
    sw.classList.remove('busy');
    if (!up) { going = false; return toast(name + ' is not running', e[0] === 'dev' ? 'The installed app is not answering.' : 'Start it with npm run dev in the Foreman folder.'); }
    hudLeave(); u.hash = 'fmsw=' + encodeURIComponent(JSON.stringify({ ts: Date.now(), fields: {}, scroll: {}, win: [0, 0] }));
    document.documentElement.classList.remove('env-in'); document.documentElement.classList.add('env-out');
    setTimeout(() => { location.href = u.href; }, 160);
  };
  sw.querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.env === e[0]); b.title = b.dataset.env === e[0] ? 'You are here' : 'Switch to ' + (b.dataset.env === 'dev' ? 'the dev server (this folder)' : 'the installed app (production)') + ' · Ctrl+Alt+D';
    b.onclick = () => { if (b.dataset.env !== e[0]) go(); }; });
  addEventListener('keydown', ev => { if (ev.ctrlKey && ev.altKey && !ev.shiftKey && ev.code === 'KeyD') { ev.preventDefault(); go(); } });
  addEventListener('pageshow', ev => { if (ev.persisted) { going = false; document.documentElement.classList.remove('env-out'); } }); // back button from the other side
})();

// ---------- socket ----------
let bootId = null;
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => { $('#online').classList.add('on'); $('#onTxt').textContent = 'ONLINE'; send({ t: 'hello', cid: CID, device: MOBILE ? 'mobile' : 'desktop' }); reportView(true); };
  ws.onclose = () => { window.updLost?.(); $('#online').classList.remove('on'); $('#onTxt').textContent = 'RECONNECTING'; setTimeout(connect, 1500); };
  ws.onmessage = e => handle(JSON.parse(e.data));
}
const send = m => (ws?.readyState === 1 && ws.send(JSON.stringify(m)));
// View gate: tell the server whether this HUD is in front of the user (visible, focused, used in the last 10 min); the finish ding goes to that HUD. Hidden/locked: say so at once (beacon too: the socket may be dead).
let lastInput = Date.now(), viewSent = null;
for (const ev of ['pointerdown', 'keydown', 'touchstart']) addEventListener(ev, () => { lastInput = Date.now(); if (!viewSent) reportView(); }, { capture: true, passive: true });
const inView = () => document.visibilityState === 'visible' && document.hasFocus() && Date.now() - lastInput < 600000;
function reportView(force) {
  const v = inView();
  if (force || v || v !== viewSent) send({ t: 'vis', active: v }); // while in view, re-sent as a heartbeat (server forgets after 40s)
  if (!v && viewSent !== false) navigator.sendBeacon?.('/api/push/view', JSON.stringify({ cid: CID, active: false }));
  viewSent = v;
}
document.addEventListener('visibilitychange', () => reportView());
addEventListener('focus', () => reportView());
addEventListener('blur', () => reportView());
addEventListener('pagehide', () => reportView());
setInterval(reportView, 15000);
// Sent messages wait here until the server echoes them back. After the phone sleeps, iOS keeps a dead socket looking "open",
// so the first thing said would vanish: no echo within 4s → open a fresh socket and resend.
const outbox = []; let ackT;
const armAck = () => { clearTimeout(ackT); ackT = setTimeout(() => { if (!outbox.length) return; ws.onclose = null; try { ws.close(); } catch {} connect(); }, 4000); };
// Typed messages to an agent pane use the same outbox: a send over a dead/not-yet-open socket used to vanish while the box cleared (first message lost).
function sendTracked(m) { m.tries = 0; outbox.push(m); send(m); armAck(); }

// Installed copy only: the server says a newer release (or a rollback) is ready. Restart waits until no agent is working.
let updState = null; // the server's update info (null = up to date / not an installed copy)
function showUpdate(u) { updState = u || null; if (!u && updGone) updGone = false; setSync(); }
// Update progress (2026-11-14: "no feedback so I know the update is working"): a pill left of the gear while an update runs

let updGone = false, updClickAt = 0; // updGone: the server dropped the socket while an update was pending = it is restarting
const UPD_KEY = 'fmUpdating';

const updPill = document.createElement('button'); updPill.type = 'button'; updPill.className = 'updpill'; updPill.hidden = true;
updPill.onclick = e => { e.stopPropagation(); setOpen(true, 'general'); };
$('#setBtn').before(updPill);
function updPhase() { // null | 'wait' | 'restart' | 'reopen'

}
function updPillSync() {

  updPill.innerHTML = `<i class="updspin"></i><span>${txt}</span>`;
  updPill.title = ph === 'wait' ? `The update starts once ${u.busy.join(', ')} ${n === 1 ? 'finishes' : 'finish'}` : 'Foreman is restarting into the new version';
}

// after the relaunch: did we land on the release we asked for?
function updVerify(info) {

// ---------- Settings (gear, top right): version + Check for updates. Replaces the "Update ready" popups: nothing pops up, the user checks here.
// Installed copy: Check for updates → asks the server (GET /api/update) → "Update now" restarts into the new release once no agent is working.
// Dev / source copy: no releases here; when the interface files changed without a restart it offers "Reload interface". The gear shows a dot when either is waiting.
const setMenu = document.createElement('div'); setMenu.id = 'setMenu'; setMenu.setAttribute('role', 'dialog'); setMenu.setAttribute('aria-label', 'Settings'); setMenu.hidden = true; document.body.append(setMenu);
